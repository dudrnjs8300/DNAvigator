name: windows-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pyinstaller

      - name: Quality gate
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m ruff format --check src tests
          python -m ruff check src tests
          python -m mypy src/genome_workbench
          python -m pytest tests -q

      - name: Build onedir executable
        run: python -m PyInstaller scripts/genome_workbench.spec --distpath dist --workpath build --noconfirm

      - name: Packaging smoke test (clean runner)
        run: |
          .\dist\GenomeWorkbench\GenomeWorkbench.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "self-test failed on packaged build" }
          New-Item -ItemType Directory -Force -Path smoke_out | Out-Null
          .\dist\GenomeWorkbench\GenomeWorkbench.exe --smoke-test tests\fixtures smoke_out
          if ($LASTEXITCODE -ne 0) { throw "smoke-test failed on packaged build" }

      - name: Package portable ZIP
        run: |
          Compress-Archive -Path dist\GenomeWorkbench\* -DestinationPath GenomeWorkbench-portable-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GenomeWorkbench-windows-x64
          path: |
            GenomeWorkbench-portable-win-x64.zip

