name: windows-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pyinstaller

      - name: Quality gate
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m ruff format --check src tests
          python -m ruff check src tests
          python -m mypy src/genome_workbench
          python -m pytest tests -q

      - name: Build onedir executable
        run: python -m PyInstaller scripts/genome_workbench.spec --distpath dist --workpath build --noconfirm

      - name: Packaging smoke test (clean runner)
        run: |
          $exe = ".\dist\GenomeWorkbench\GenomeWorkbench.exe"

          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -NoNewWindow -PassThru -Wait `
            -RedirectStandardOutput selftest_stdout.txt -RedirectStandardError selftest_stderr.txt
          Write-Host "self-test exit code: $($p.ExitCode)"
          Write-Host "--- stdout ---"; Get-Content selftest_stdout.txt -ErrorAction SilentlyContinue
          Write-Host "--- stderr ---"; Get-Content selftest_stderr.txt -ErrorAction SilentlyContinue
          $jsonPath = "$env:LOCALAPPDATA\GenomeWorkbench\last_self_test_output.json"
          if (Test-Path $jsonPath) { Write-Host "--- last_self_test_output.json ---"; Get-Content $jsonPath }
          if ($p.ExitCode -ne 0) { throw "self-test failed on packaged build (exit $($p.ExitCode))" }

          New-Item -ItemType Directory -Force -Path smoke_out | Out-Null
          $p2 = Start-Process -FilePath $exe -ArgumentList "--smoke-test", "tests\fixtures", "smoke_out" -NoNewWindow -PassThru -Wait `
            -RedirectStandardOutput smoketest_stdout.txt -RedirectStandardError smoketest_stderr.txt
          Write-Host "smoke-test exit code: $($p2.ExitCode)"
          Write-Host "--- stdout ---"; Get-Content smoketest_stdout.txt -ErrorAction SilentlyContinue
          Write-Host "--- stderr ---"; Get-Content smoketest_stderr.txt -ErrorAction SilentlyContinue
          $jsonPath2 = "$env:LOCALAPPDATA\GenomeWorkbench\last_smoke_test_output.json"
          if (Test-Path $jsonPath2) { Write-Host "--- last_smoke_test_output.json ---"; Get-Content $jsonPath2 }
          if ($p2.ExitCode -ne 0) { throw "smoke-test failed on packaged build (exit $($p2.ExitCode))" }

      - name: Package portable ZIP
        run: |
          Compress-Archive -Path dist\GenomeWorkbench\* -DestinationPath GenomeWorkbench-portable-win-x64.zip

      - name: Build installer (Inno Setup)
        run: |
          $candidate = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc -and (Test-Path $candidate)) { $iscc = $candidate }
          if (-not $iscc) {
            Write-Host "Inno Setup not found on this runner -- installing via choco"
            choco install innosetup -y --no-progress | Out-Null
            $iscc = $candidate
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after install attempt" }
          Write-Host "Using Inno Setup compiler: $iscc"

          New-Item -ItemType Directory -Force -Path release | Out-Null
          & $iscc installer\genome_workbench.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed (exit $LASTEXITCODE)" }

          $setup = Get-ChildItem release\GenomeWorkbench-*-win-x64-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "Inno Setup did not produce a setup .exe under release\" }
          Write-Host "Built installer: $($setup.FullName)"

      - name: Installer silent install / self-test / uninstall (clean runner)
        run: |
          $setup = Get-ChildItem release\GenomeWorkbench-*-win-x64-setup.exe | Select-Object -First 1
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\GenomeWorkbench"

          Write-Host "==> silent install"
          $pInstall = Start-Process -FilePath $setup.FullName `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LANG=english" `
            -PassThru -Wait
          Write-Host "installer exit code: $($pInstall.ExitCode)"
          if ($pInstall.ExitCode -ne 0) { throw "silent install failed (exit $($pInstall.ExitCode))" }

          $installedExe = Join-Path $installDir "GenomeWorkbench.exe"
          if (-not (Test-Path $installedExe)) { throw "installed exe not found at $installedExe" }
          Write-Host "Installed to: $installedExe (no admin prompt -- PrivilegesRequired=lowest)"

          Write-Host "==> installed --self-test"
          $pSelfTest = Start-Process -FilePath $installedExe -ArgumentList "--self-test" -NoNewWindow -PassThru -Wait `
            -RedirectStandardOutput installer_selftest_stdout.txt -RedirectStandardError installer_selftest_stderr.txt
          Write-Host "self-test exit code: $($pSelfTest.ExitCode)"
          Get-Content installer_selftest_stdout.txt -ErrorAction SilentlyContinue
          if ($pSelfTest.ExitCode -ne 0) { throw "installed self-test failed (exit $($pSelfTest.ExitCode))" }

          Write-Host "==> Start Menu shortcut check"
          $shortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\GenomeWorkbench.lnk"
          if (-not (Test-Path $shortcut)) { throw "Start Menu shortcut not found at $shortcut" }

          Write-Host "==> silent uninstall"
          $uninstaller = Join-Path $installDir "unins000.exe"
          $pUninstall = Start-Process -FilePath $uninstaller `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" `
            -PassThru -Wait
          Write-Host "uninstaller exit code: $($pUninstall.ExitCode)"
          if ($pUninstall.ExitCode -ne 0) { throw "silent uninstall failed (exit $($pUninstall.ExitCode))" }
          if (Test-Path $installedExe) { throw "install directory still present after uninstall" }
          Write-Host "Uninstall removed the install directory cleanly."

      - uses: actions/upload-artifact@v4
        with:
          name: GenomeWorkbench-windows-x64
          path: |
            GenomeWorkbench-portable-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GenomeWorkbench-installer
          path: release\GenomeWorkbench-*-win-x64-setup.exe

      - name: Publish GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $setup = Get-ChildItem release\GenomeWorkbench-*-win-x64-setup.exe | Select-Object -First 1

          $notes = @"
          # GenomeWorkbench $tag (Windows x64)

          ## 설치 방법
          아래 첨부 파일 중 **$($setup.Name)** 를 내려받아 더블클릭하세요.
          - 관리자 권한이 필요 없습니다.
          - Windows에서 "이 앱이 PC에 손상을 일으킬 수 있습니다" 같은 SmartScreen 경고가 뜨면, "추가 정보" -> "실행"을 누르면 설치가 진행됩니다(서명 인증서가 없어서 뜨는 정상적인 경고입니다).

          압축 없이 그냥 실행만 하고 싶다면 portable ZIP(GenomeWorkbench-portable-win-x64.zip)을 받아 원하는 폴더에 풀어서 GenomeWorkbench.exe를 바로 실행해도 됩니다.

          ## 이 빌드는 이렇게 검증되었습니다
          아무것도 미리 깔려 있지 않은 깨끗한 Windows 환경(GitHub Actions runner)에서, 이 설치 파일로 실제로 설치 -> 실행 확인 -> 제거까지 자동으로 테스트를 통과한 뒤에만 올라갑니다.

          더 자세한 사용법은 저장소의 README와 docs/USER_GUIDE_KO.md를 참고하세요.
          "@

          Set-Content -Path release_notes.md -Value $notes -Encoding utf8

          gh release create $tag `
            "$($setup.FullName)" `
            "GenomeWorkbench-portable-win-x64.zip" `
            --title "GenomeWorkbench $tag" `
            --notes-file release_notes.md

